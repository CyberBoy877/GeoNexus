<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoNexus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            🌍 GeoNexus
        </div>

        <p class="tagline">
            Explore the World. Discover Everything.
        </p>
    </header>

    <main>

        <section class="hero">
            <h1>Explore Our World</h1>

            <p>
                Discover countries, states, provinces and
                geographic regions through an interactive map.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search a country..."
                >

                <button onclick="searchCountry()">
                    Search
                </button>
            </div>
        </section>

        <section class="map-container">

            <h2>Interactive World Map</h2>

            <div id="map">
                <p>World map coming soon...</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 GeoNexus</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
