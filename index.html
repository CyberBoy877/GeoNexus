<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoNexus | Explore the World</title>

    <meta
        name="description"
        content="GeoNexus is an interactive world map for exploring countries and geographic regions."
    >

    <link rel="stylesheet" href="style.css">

    <!-- D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- TopoJSON -->
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            🌍 GeoNexus
        </div>

        <p class="tagline">
            Explore the World. Discover Everything.
        </p>

    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- HERO -->
        <section class="hero">

            <h1>
                Explore Our World
            </h1>

            <p>
                Discover countries and geographic regions
                through an interactive world map.
            </p>

            <!-- SEARCH -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search a country..."
                    autocomplete="off"
                >

                <button onclick="searchCountry()">
                    Search
                </button>

            </div>

        </section>


        <!-- MAP -->
        <section class="map-container">

            <h2>
                Interactive World Map
            </h2>

            <div id="map">

                <div class="loading">
                    Loading world map...
                </div>

            </div>


            <!-- COUNTRY INFORMATION -->
            <div id="country-info">

                <h2>
                    🌍 Select a country
                </h2>

                <p>
                    Click any country on the map to explore it.
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 GeoNexus
        </p>

    </footer>


    <!-- GeoNexus JavaScript -->
    <script src="script.js"></script>

</body>

</html>
